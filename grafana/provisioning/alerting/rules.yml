apiVersion: 1

groups:
  - orgId: 1
    name: demo-app-alerts
    folder: Observability Lab
    folderUID: observability-lab
    interval: 1m
    rules:
      - uid: app-error-rate-critical
        title: CRITICAL - High Application Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: sum(rate(app_errors_total[1m])) * 60
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              type: threshold
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: Application error rate exceeds 5 per minute
          description: The demo app is returning more than 5 errors per minute.
        labels:
          severity: critical
